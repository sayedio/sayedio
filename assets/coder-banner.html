<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayed Sheikh - Full-Stack Developer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      }

      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes glowBreath {
        0%,
        100% {
          opacity: 0.38;
        }
        50% {
          opacity: 0.6;
        }
      }

      .banner {
        position: relative;
        width: 1000px;
        height: 300px;
        display: grid;
        grid-template-columns: 1fr 1.05fr;
        align-items: center;
        padding: 0 48px 0 64px;
        border-radius: 10px;
        overflow: hidden;
        background: linear-gradient(
          125deg,
          #040b18 0%,
          #071428 20%,
          #08192e 35%,
          #061223 50%,
          #071933 65%,
          #050e1f 80%,
          #040b18 100%
        );
        background-size: 300% 300%;
        animation: bgShift 18s ease infinite;
      }

      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, #1d4ed8 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.05;
        pointer-events: none;
      }

      .glow-layer {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 40% 55% at 22% 50%, #0d2a5e 0%, transparent 70%),
          radial-gradient(ellipse 42% 55% at 78% 48%, #081e42 0%, transparent 70%);
        animation: glowBreath 7s ease-in-out infinite;
        pointer-events: none;
      }

      .identity {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .identity h1 {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #93c5fd;
        line-height: 1;
      }

      .identity .line {
        width: 186px;
        height: 1.25px;
        background: #3b82f6;
        opacity: 0.55;
      }

      .identity p {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #94a3b8;
      }

      .art {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .art img {
        width: 420px;
        height: 244px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="grid-overlay"></div>
      <div class="glow-layer"></div>

      <div class="identity">
        <h1>SAYED SHEIKH</h1>
        <div class="line"></div>
        <p>FULL-STACK DEVELOPER</p>
      </div>

      <div class="art">
        <img src="dev-working_rounded_clean.gif" alt="Developer animation" />
      </div>
    </div>
  </body>
</html>
